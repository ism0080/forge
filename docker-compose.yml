services:
  api:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    environment:
      PORT: 8787
      SITE_BUCKET: forge-sites
      STORAGE_ROOT: /app/data
      DB_MIGRATION_MAX_COUNT: 100
      DB_MIGRATION_MAX_BYTES: 1000000
      DB_MIGRATION_MAX_BUNDLE_BYTES: 5000000
      DB_MIGRATION_TIMEOUT_MS: 30000
      EXTERNAL_API_URL: ${EXTERNAL_API_URL}
      EXTERNAL_API_KEY: ${EXTERNAL_API_KEY}
    volumes:
      - forge-data:/app/data
    ports:
      - "8787:8787"
    env_file: .env

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8880:80"

volumes:
  forge-data:
