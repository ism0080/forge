services:
  api:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    # Non-secret config lives in .env.schema (baked into the image); this only
    # layers in local overrides/secrets when .env.local exists.
    env_file:
      - path: .env.local
        required: false
    volumes:
      - forge-data:/app/data
    ports:
      - "8787:8787"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8880:80"

volumes:
  forge-data:
